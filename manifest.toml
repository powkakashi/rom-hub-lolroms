[plugin]
slug        = "lolroms"
name        = "LoLSuite ROMs"
version     = "0.2.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
search   = "lolroms.search:Search"
importer = "lolroms.importer:Importer"

[permissions]
network = ["lolroms.com"]
romm_api = []

[config]
# platform -> section path(s), `|` separating the platform's own directory from its Pokéhacks
# section. Verified against the live site 2026-11-20; add another pair for a new platform.
systems = { type = "str", default = "gb=Nintendo/Game Boy|Pokéhacks/Game Boy,gbc=Nintendo/Game Boy Color|Pokéhacks/Game Boy Color,gba=Nintendo/Game Boy Advance|Pokéhacks/Game Boy Advance,nds=Nintendo/DS,n64=Nintendo/Nintendo 64,snes=Nintendo/Super Famicom,nes=Nintendo/Nintendo Entertainment System" }
max_rows = { type = "int", default = 25 }
