[plugin]
slug        = "lolroms"
name        = "LoLSuite ROMs"
version     = "0.1.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
search   = "lolroms.search:Search"
importer = "lolroms.importer:Importer"

[permissions]
network = ["lolroms.com"]
romm_api = []

[config]
# Pokéhacks sections the site publishes: Game Boy, Game Boy Color, Game Boy Advance.
systems = { type = "str", default = "gb=Game Boy,gbc=Game Boy Color,gba=Game Boy Advance" }
max_rows = { type = "int", default = 25 }
